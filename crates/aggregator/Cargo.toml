[package]
name        = "uni-aggregator"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true

[[bin]]
name = "aggregator"
path = "src/main.rs"

[[bin]]
name = "perf-test"
path = "src/bin/perf_test.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# CBOR
ciborium.workspace = true

# Hash
sha2.workspace = true

# Crypto – secp256k1 with compact-recovery
secp256k1.workspace = true

# SMT
rsmt.workspace       = true

# SMT store (disk + memory backends)
smt-store.workspace  = true

# Serialization
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Config
clap.workspace = true

# Concurrent map for record store
dashmap.workspace = true

# Async utils
futures.workspace = true
async-trait.workspace = true

# BFT Core live connectivity
libp2p.workspace = true
unsigned-varint.workspace = true
serde_bytes.workspace = true
serde_tuple.workspace = true
rand.workspace = true

# RocksDB persistence
rocksdb.workspace = true

# LRU cache for disk-backed SMT nodes
lru.workspace = true

# Parallel iterators
rayon.workspace = true

# Raise OS file-descriptor limit at startup
libc.workspace = true

# TCP listener with explicit backlog
socket2.workspace = true

# ZK prover host (SP1).  All heavy deps are gated behind zk-host's own
# `prove` feature which this crate's `zk` feature activates.
zk-host.workspace = true

[features]
# Enable the real SP1 prover.  Without this the aggregator still compiles and
# runs in `off` and `rsmt` modes; selecting `zk` mode at runtime will error.
zk = ["zk-host/prove"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
